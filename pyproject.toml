[project]
name = "pampa"
version = "0.1.1"
description = "A AI cli agent, for educational and testing purposes"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Xavier Petit", email = "nuxion@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
    "openai>=2.53.0",
    "prompt-toolkit>=3.0.53",
]
[build-system]
requires = ["hatchling"] 
build-backend = "hatchling.build"

dependencies = []

[tool.jupytext]
formats = "ipynb,py"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]
